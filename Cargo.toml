[package]
name = "eth-wasm-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "A deterministic, fuel-metered WebAssembly runtime for proof verifiers"
license = "MIT"
repository = "https://github.com/Naveen-6087/pandora"
keywords = ["ethereum", "wasm", "verifier", "deterministic", "proof"]
categories = ["wasm", "cryptography::cryptocurrencies", "command-line-utilities"]
exclude = ["/guests/target"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2.0"
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable", "deterministic", "portable-dispatch"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.5"
serde_json = "1"
sha2 = "0.10"
wat = "1.220"

[[bench]]
name = "verify"
harness = false
